services:
  # Service Node.js
  app:
    build: .
    container_name: imc-app
    ports:
      - "3000:3000"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: imc_db
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      - imc-network
    restart: unless-stopped

  # Service MySQL
  db:
    image: mysql:8.0
    container_name: imc-db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: imc_db
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - imc-network
    restart: unless-stopped

volumes:
  db-data:

networks:
  imc-network:
    driver: bridge